name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # ubuntu-22.04 (glibc antigo) mantém o AppImage compatível com
    # Ubuntu 22.04+, BigLinux e derivados — não trocar por ubuntu-latest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de build
        run: |
          sudo apt-get update
          # patchelf: rpath do bundle pjsua2. Demais pacotes: dependências
          # diretas das libs PJSIP (áudio/vídeo/codecs/TLS) que um desktop
          # Linux tem; o apt resolve as transitivas.
          sudo apt-get install -y patchelf \
            libasound2 libavcodec-extra58 libavutil56 libbcg729-0 \
            libopenh264-6 libopus0 libsdl2-2.0-0 libssl3 libswscale5 \
            libuuid1 libv4l-0 libvpx7
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Restaurar binários pjsua2/PJSIP (release de assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pjsua2-assets-2.15-py312 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pjsua2-linux-py312-2.15.tar.gz' \
            --dir /tmp/assets
          mkdir -p third_party/pjsip-dist/lib
          tar -xzf /tmp/assets/pjsua2-linux-py312-2.15.tar.gz -C /tmp/assets
          cp /tmp/assets/pjsua2/pjsua2.py /tmp/assets/pjsua2/_pjsua2.cpython-312-x86_64-linux-gnu.so \
             .venv/lib/python3.12/site-packages/
          cp /tmp/assets/pjsip-lib/lib*.so* third_party/pjsip-dist/lib/

      - name: Validar import do pjsua2 (glibc/bibliotecas)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/pjsip-dist/lib
        run: .venv/bin/python -c "import pjsua2; assert pjsua2.PJSIP_INV_STATE_CONFIRMED is not None; print('pjsua2 OK')"

      - name: Baixar appimagetool
        run: |
          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Testes antes de empacotar
        run: |
          .venv/bin/pip install pytest
          .venv/bin/python -m pytest tests/ -q

      - name: Gerar AppImage
        run: ./build_exe.sh

      - name: Publicar na release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber VoiceNeves-x86_64.AppImage
