name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  appimage:
    # ubuntu-22.04 (glibc antigo) mantém o AppImage compatível com
    # Ubuntu 22.04+, BigLinux e derivados — não trocar por ubuntu-latest.
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Os runners hospedados têm ~14 GB e acumulam toolchains pesados pré-
      # instalados (dotnet, Android, sw, docs). O bundle PySide6/Qt + AppImage
      # enche o disco (erro "No space left on device" no host). Remove os que o
      # build não usa, liberando espaço antes de começar.
      - name: Liberar espaço no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /usr/local/share/swift /opt/ghc /usr/lib/swift \
            /usr/local/share/powershell /home/runner/.cache/duckdb \
            /usr/local/lib/node_modules /usr/share/pypy \
            /home/runner/.cargo/registry 2>/dev/null || true
          sudo apt-get clean
          rm -rf /home/runner/.cache/pip 2>/dev/null || true
          df -h / && echo "--- espaço acima ao iniciar o build ---"

      - name: Instalar dependências de build
        run: |
          sudo apt-get update
          # patchelf: rpath do bundle pjsua2. Demais pacotes: dependências
          # diretas das libs PJSIP (áudio/vídeo/codecs/TLS) que um desktop
          # Linux tem; o apt resolve as transitivas.
          sudo apt-get install -y patchelf \
            libasound2 libavcodec-extra58 libavutil56 libbcg729-0 \
            libopenh264-6 libopus0 libsdl2-2.0-0 libssl3 libswscale5 \
            libuuid1 libv4l-0 libvpx7 \
            libxcb-cursor0
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Restaurar binários pjsua2/PJSIP (release de assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pjsua2-assets-2.15-py312 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pjsua2-linux-py312-2.15.tar.gz' \
            --dir /tmp/assets
          mkdir -p third_party/pjsip-dist/lib
          tar -xzf /tmp/assets/pjsua2-linux-py312-2.15.tar.gz -C /tmp/assets
          cp /tmp/assets/pjsua2/pjsua2.py /tmp/assets/pjsua2/_pjsua2.cpython-312-x86_64-linux-gnu.so \
             .venv/lib/python3.12/site-packages/
          cp /tmp/assets/pjsip-lib/lib*.so* third_party/pjsip-dist/lib/

      - name: Validar import do pjsua2 (glibc/bibliotecas)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/pjsip-dist/lib
        run: .venv/bin/python -c "import pjsua2; assert pjsua2.PJSIP_INV_STATE_CONFIRMED is not None; print('pjsua2 OK')"

      - name: Baixar appimagetool
        run: |
          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Testes antes de empacotar
        run: |
          .venv/bin/pip install pytest
          .venv/bin/python -m pytest tests/ -q

      - name: Gerar AppImage
        run: ./build_exe.sh

      - name: Publicar na release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file <(git tag -l -n999 "$GITHUB_REF_NAME") 2>&1 | tail -2 || true
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file <(git tag -l -n999 "$GITHUB_REF_NAME") 2>&1 | tail -2 || true
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber VoiceNeves-x86_64.AppImage

      - name: Gerar pacote .deb
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/pjsip-dist/lib
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm || true
          chmod +x packaging/build_deb.sh || true
          # Remove .deb versionados no repo (ex.: artefato de release anterior)
          # para o glob de publicação pegar só o pacote recém-gerado.
          rm -f *.deb
          ./packaging/build_deb.sh || true
          ls -lh *.deb 2>/dev/null || true

      - name: Publicar .deb na release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for deb in *.deb; do
            [ -f "$deb" ] || continue
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$deb"
          done

      - name: Gerar pacote Flatpak e repositório OSTree assinado
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.8 org.kde.Sdk//6.8 || true

          # Chave GPG (secret FLATPAK_GPG_PRIVATE_KEY) para assinar o repositório
          # Flatpak. É importada ANTES do build para o flatpak-builder já assinar
          # cada commit do export (o cliente exige assinatura de commit e sumário).
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null || true
          GPG_FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          echo "GPG fingerprint: $GPG_FPR"
          SIGN_ARGS=()
          if [ -n "$GPG_FPR" ]; then
            SIGN_ARGS=(--gpg-sign="$GPG_FPR" --gpg-homedir="$GNUPGHOME")
          fi

          mkdir -p build-flatpak repo
          flatpak-builder --force-clean --repo=repo "${SIGN_ARGS[@]}" \
            build-flatpak packaging/flatpak/com.edesneves.VoiceNeves.yml || true
          flatpak build-bundle repo "VoiceNeves-${{ github.ref_name }}.x86_64.flatpak" com.edesneves.VoiceNeves || true
          ls -lh *.flatpak 2>/dev/null || true

          # --- Repositório Flatpak remoto (para o app "Programas"/GNOME Software) ---
          flatpak build-update-repo --generate-static-deltas \
            --title="Voice Neves" --comment="Softphone SIP (Voice Neves)" \
            --homepage="https://github.com/${GITHUB_REPOSITORY}" \
            "${SIGN_ARGS[@]}" repo || true
          echo "== refs do repo =="; ostree refs --repo=repo || true

          # Monta o site do GitHub Pages: o repo + os arquivos .flatpakrepo/.flatpakref
          PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p pages
          cp -a repo pages/repo
          PUB_B64="$(gpg --homedir "$GNUPGHOME" --armor --export "$GPG_FPR" | base64 -w0)"
          BRANCH="$(ostree refs --repo=repo | sed -n 's#^app/com.edesneves.VoiceNeves/x86_64/##p' | head -1)"
          BRANCH="${BRANCH:-master}"
          {
            echo '[Flatpak Repo]'
            echo 'Title=Voice Neves'
            echo "Url=${PAGES_BASE}/repo/"
            echo "Homepage=https://github.com/${GITHUB_REPOSITORY}"
            echo 'Comment=Softphone SIP (Voice Neves)'
            echo "GPGKey=${PUB_B64}"
          } > pages/voiceneves.flatpakrepo
          {
            echo '[Flatpak Ref]'
            echo 'Title=Voice Neves'
            echo 'Name=com.edesneves.VoiceNeves'
            echo "Branch=${BRANCH}"
            echo "Url=${PAGES_BASE}/repo/"
            echo "GPGKey=${PUB_B64}"
            echo 'IsRuntime=false'
            echo "RuntimeRepo=${PAGES_BASE}/voiceneves.flatpakrepo"
          } > pages/com.edesneves.VoiceNeves.flatpakref
          ls -lh pages pages/repo 2>/dev/null || true

      - name: Upload do site (Pages)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy no GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        id: deploy_pages
        uses: actions/deploy-pages@v4

      - name: Publicar Flatpak na release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for fp in *.flatpak; do
            [ -f "$fp" ] || continue
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$fp"
          done

      # version.json é a fonte de verdade da atualização automática. É gerado
      # com o sha256 real do AppImage, anexado à release e commitado no branch
      # padrão para ter uma URL estável e imutável (raw.githubusercontent.com).
      # O formato contempla as duas plataformas: url_linux/url_win apontam para
      # o binário de cada SO no mesmo version.json.
      - name: Gerar e publicar version.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          SHA="$(sha256sum VoiceNeves-x86_64.AppImage 2>/dev/null | awk '{print $1}')"
          [ -z "$SHA" ] && SHA=""
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/VoiceNeves-x86_64.AppImage"
          URL_WIN="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/VoiceNeves.exe"
          SHA_WIN=""
          if [ -f VoiceNeves.exe ]; then
            SHA_WIN="$(sha256sum VoiceNeves.exe | awk '{print $1}')"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber VoiceNeves.exe 2>/dev/null || true
          elif [ -f dist/VoiceNeves.exe ]; then
            SHA_WIN="$(sha256sum dist/VoiceNeves.exe | awk '{print $1}')"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/VoiceNeves.exe 2>/dev/null || true
          fi
          printf '{"version":"%s","url":"%s","sha256":"%s","url_linux":"%s","sha256_linux":"%s","url_win":"%s","sha256_win":"%s"}\n' \
            "$VERSION" "$URL" "$SHA" "$URL" "$SHA" "$URL_WIN" "$SHA_WIN" > version.json
          echo "== version.json =="
          cat version.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber version.json 2>/dev/null || true
          # O updater lê version.json do branch padrão (raw.githubusercontent.com),
          # não do asset da release. Sem este commit o app nunca veria a versão
          # nova. A tag é criada sobre o master, então o push é fast-forward.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: version.json para ${TAG}" || true
          git push origin HEAD:master || true
