app-id: com.edesneves.VoiceNeves
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: voiceneves
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=~/.config/softphone:rw
  - --filesystem=~/.local/share/softphone:rw
modules:
  # Empacota o bundle do PyInstaller (dist/VoiceNeves), que já traz o Python
  # embutido, o binding pjsua2 e as libs do PJSIP/codecs. Assim o Flatpak NÃO
  # depende de recompilar o PJSIP nem de versões específicas de libs de codec do
  # runtime — roda igual ao AppImage/.deb. Requer ./build_exe.sh antes.
  - name: voiceneves
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/voiceneves
      - cp -a . /app/share/voiceneves/
      - install -Dm755 voiceneves.sh /app/bin/voiceneves
      - install -Dm644 VoiceNeves.desktop /app/share/applications/com.edesneves.VoiceNeves.desktop
      - install -Dm644 voiceneves.png /app/share/icons/hicolor/256x256/apps/com.edesneves.VoiceNeves.png
      - install -Dm644 voiceneves.png /app/share/icons/hicolor/512x512/apps/com.edesneves.VoiceNeves.png
      - install -Dm644 voiceneves.png /app/share/icons/hicolor/256x256/apps/voiceneves.png
    sources:
      - type: dir
        path: ../../dist/VoiceNeves
      - type: file
        path: voiceneves.sh
      - type: file
        path: ../../VoiceNeves.desktop
      - type: file
        path: ../../voiceneves.png
